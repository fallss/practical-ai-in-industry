[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "practical-ai-in-industry"
version = "1.0.0"
description = "Production-grade ML Hotel Search Ranking & Cross-Sell Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.30.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
