version: '3.8'

services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: practical-ai-in-industry/hotel-ml-service:latest
    container_name: ota-ml-ranking-engine
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
